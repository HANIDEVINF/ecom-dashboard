<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4fc65"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6838"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <!-- Background with squircle safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Register/Terminal Screen Silhouette -->
  <rect x="96" y="80" width="320" height="230" rx="24" fill="#1e293b" stroke="#334155" stroke-width="10"/>
  
  <!-- Receipt Paper Spooling Out with Barcode & Checkmark -->
  <path d="M156 120 h200 v140 l-16 -12 l-16 12 l-16 -12 l-16 12 l-16 -12 l-16 12 l-16 -12 l-16 12 l-16 -12 l-16 12 l-16 -12 l-16 12 v-140 z" fill="#ffffff" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.3))"/>
  
  <!-- Receipt Barcode lines -->
  <line x1="176" y1="145" x2="176" y2="185" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <line x1="192" y1="145" x2="192" y2="185" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <line x1="206" y1="145" x2="206" y2="185" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <line x1="224" y1="145" x2="224" y2="185" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <line x1="240" y1="145" x2="240" y2="185" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <line x1="258" y1="145" x2="258" y2="185" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <line x1="272" y1="145" x2="272" y2="185" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
  <line x1="292" y1="145" x2="292" y2="185" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <line x1="310" y1="145" x2="310" y2="185" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <line x1="332" y1="145" x2="332" y2="185" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Receipt text lines -->
  <line x1="176" y1="205" x2="270" y2="205" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="290" y1="205" x2="336" y2="205" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  <line x1="176" y1="225" x2="250" y2="225" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="280" y1="225" x2="336" y2="225" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  
  <!-- POS Base Stand with Cash Drawer Slot -->
  <path d="M128 340 h256 l20 60 h-296 z" fill="#334155"/>
  <rect x="180" y="365" width="152" height="12" rx="4" fill="#0f172a"/>
  
  <!-- Accent Badge (Algerian Star & DZD Token) -->
  <circle cx="380" cy="380" r="56" fill="url(#accentGrad)" filter="drop-shadow(0 6px 14px rgba(228,252,101,0.4))"/>
  <text x="380" y="392" font-family="Arial, sans-serif" font-weight="900" font-size="32" fill="#0f172a" text-anchor="middle">DA</text>
</svg>
